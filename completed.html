<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>财务统计报表(修复版) - TMS</title>
<style>
:root{--accent:var(--c-primary);--ok:var(--c-success);--bad:var(--c-danger);--bg:#f5f7fb;}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:#222}
.header{padding:18px 20px;background:white;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,0.06)}
.header h1{margin:0;font-size:18px;color:var(--accent)}
.container{max-width:1600px;margin:18px auto;padding:18px}

/* 配置栏 */
.config-bar { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid var(--accent); }
.config-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
.input-s { padding: 6px; border: 1px solid #ddd; border-radius: 4px; width: 80px; }

.filterCard{background:white;padding:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.04);display:flex;gap:12px;align-items:center;margin-bottom:12px}
.input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.btn{padding:8px 16px;border-radius:6px;border:none;background:var(--accent);color:white;cursor:pointer;font-weight:600}
.btn-export{background:var(--ok)}

.table-container{background:white;border-radius:8px;overflow-x:auto;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1500px}
th{background:#f8f9fc;text-align:left;padding:12px;color:#666;border-bottom:2px solid #edf0f5;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #edf0f5;color:#444;vertical-align:middle}
tr:hover{background:#fcfdfe}
.badge-gp{padding:4px 8px;border-radius:4px;font-weight:bold}
.gp-pos{background:#e8f5e9;color:var(--c-success)}
.gp-neg{background:#ffebee;color:var(--c-danger)}

/* 手动费用输入框 */
.extra-input-group { display: flex; align-items: center; gap: 4px; }
.input-mini { width: 55px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; }
.btn-save { padding: 4px 6px; background: var(--ok); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/theme.css">
<script src="assets/js/tms-core.js"></script>
</head>
<body>

<script>
// 登录校验：凭证存 sessionStorage；财务统计仅管理员可访问
TMS.session.requireRole(['admin']);
</script>

<div class="header">
  <button class="btn" onclick="location.href='index.html'"><i class="bi bi-arrow-left"></i> 返回</button>
  <h1>已完成订单财务统计 / Financial Report</h1>
</div>

<div class="container">
  <div class="config-bar">
    <div class="config-item">
      <span><i class="bi bi-fuel-pump"></i> 燃油单价(USD/L):</span>
      <input type="number" id="fuelPrice" class="input-s" value="1.17" step="0.01">
    </div>
    <div class="config-item">
      <span><i class="bi bi-currency-exchange"></i> 兜底汇率(无历史记录时):</span>
      <input type="number" id="exRate" class="input-s" value="20" step="0.1">
    </div>
    <div style="color:#999; font-size:12px">提示：修改参数后点击“查询”刷新计算。其他费用修改后请点击“存”。</div>
  </div>

  <div class="filterCard">
    <label>日期:</label>
    <input type="date" id="dateFilter" class="input">
    <label>关键字:</label>
    <input type="text" id="keyword" class="input" placeholder="订单/客户/车牌..." style="width:200px">
    <button class="btn" id="searchBtn">查询并重算</button>
    <button class="btn btn-export" id="exportBtn">导出报告</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>订单信息</th>
          <th>客户/车牌</th>
          <th>完成天数</th>
          <th>里程/油耗</th>
          <th>预设运费(USD)</th>
          <th>过境费(USD)</th>
          <th>燃油成本(USD)</th>
          <th>路上费用(折算USD)</th>
          <th>OA/路上明细(USD)</th>
          <th>其他费用(手动)</th>
          <th>毛利(USD)</th>
          <th>完成日期</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="12" style="text-align:center;padding:40px;color:#999">正在同步云端数据...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEbePpsrXwD8Okqa93UOGUFE37c8SFHS0",
  authDomain: "cjsmartcargo-datebase.firebaseapp.com",
  databaseURL: "https://cjsmartcargo-datebase-default-rtdb.firebaseio.com",
  projectId: "cjsmartcargo-datebase",
  storageBucket: "cjsmartcargo-datebase.firebasestorage.app",
  messagingSenderId: "751451468006",
  appId: "1:751451468006:web:a3cbd33cf3c2b29f624b27"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 审计日志写入器
TMS.audit.bind(p => push(ref(db, 'tms/audit_logs'), p));

const tableBody = document.getElementById('tableBody');
const searchBtn = document.getElementById('searchBtn');
const fuelPriceIn = document.getElementById('fuelPrice');
const exRateIn = document.getElementById('exRate');

// 汇率历史：折算优先用"订单归档时"的历史汇率，保证历史金额不被新汇率改写
let RATES = [];
onValue(ref(db, 'tms/fx/rates'), (snap) => {
    RATES = TMS.fx.normalize(snap.val());
    render();
});

let allOrders = {};
let allDispatch = {}; // 新增：用于存储原始派车单数据以回溯费用
let dispatchByOrder = {}; // confirmedOrderId -> dispatch（旧订单没存 relDispatchId）

function indexDispatch() {
    dispatchByOrder = {};
    Object.keys(allDispatch).forEach(k => {
        const d = allDispatch[k] || {};
        if (d.confirmedOrderId) dispatchByOrder[d.confirmedOrderId] = d;
    });
}

// 取某笔业务发生时的汇率（历史表为空时回落到输入框里的旧口径）
function rateOf(ts) {
    if (RATES.length) return TMS.fx.rateAt(RATES, ts);
    return Number(exRateIn.value) || 20;
}

// 路上费用明细（OA 审批回写 + 调度手工录入）
function collectExpenses(o) {
    const raw = o.expenses;
    const list = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? Object.values(raw) : []);
    let usd = 0, count = 0;
    const detail = [];
    list.forEach(e => {
        if (!e) return;
        const ts = Number(e.ts || e.time) || Number(o.archivedAt) || Date.now();
        const r = Number(e.rate) || rateOf(ts);
        const unit = (e.currency || 'ZMW').toUpperCase();
        const amt = Number(e.amount) || 0;
        const u = (e.usd !== undefined && e.usd !== null && e.usd !== '') ? Number(e.usd) : (unit === 'USD' ? amt : amt / r);
        usd += u;
        count++;
        detail.push(`${e.name || '费用'} ${amt} ${unit}${e.source === 'oa' ? ' (OA)' : ''}`);
    });
    return { usd, count, detail };
}

// 核心财务计算逻辑
function computeFinance(o) {
    // 历史汇率优先：按订单归档时间取当时的汇率
    const rate = rateOf(Number(o.archivedAt) || Number(o.startTime));
    const fPrice = Number(fuelPriceIn.value) || 1.17;

    // --- 修复逻辑开始：回溯数据 ---
    // 如果订单本身缺少财务数据(fRate/fTrip)，尝试通过 relDispatchId 从原始派车记录(allDispatch)中查找
    // 派车单中 transit 是对象 {val, unit}，但订单中 transit 是数字(由dispatch.html生成)
    let dData = {};
    if (o.relDispatchId && allDispatch[o.relDispatchId]) {
        dData = allDispatch[o.relDispatchId];
    } else if (o.orderId && dispatchByOrder[o.orderId]) {
        dData = dispatchByOrder[o.orderId];
    }
    
    // 1. 运费读取 (优先读取订单本身，若无则读取回溯的派车单数据)
    const fRateObj = o.fRate || dData.fRate || {};
    const revVal = Number(fRateObj.val || o.totalFee || 0);
    const revUnit = fRateObj.unit || 'USD';
    const revenueUSD = (revUnit === 'ZMW') ? (revVal / rate) : revVal;

    // 2. 路上费用折算 (Trip Money + Bonus + 司机津贴)
    const fTripObj = o.fTrip || dData.fTrip || {};
    const tripVal = Number(fTripObj.val || o.tripMoney || 0);
    const tripUnit = fTripObj.unit || 'ZMW';
    
    const fBonusObj = o.fBonus || dData.fBonus || {};
    const bonusVal = Number(fBonusObj.val || 0);
    const bonusUnit = fBonusObj.unit || 'ZMW';
    
    // 司机津贴(allowance)：业务口径已确认为【额外津贴】，与 Trip Money / Bonus 相加
    //（不替代 fTrip，两者是不同性质的钱，故此处不做二选一）
    // 单位固定为 ZMW（派车单无单位选择框，PDF 表头亦标注 ZMW），一律按当时汇率折 USD
    const allowanceVal = Number(o.allowance || 0);
    const allowanceUSD = allowanceVal / rate;

    const tripUSD = (tripUnit === 'ZMW') ? (tripVal / rate) : tripVal;
    const bonusUSD = (bonusUnit === 'ZMW') ? (bonusVal / rate) : bonusVal;
    const roadExpenseUSD = tripUSD + bonusUSD + allowanceUSD;

    // 4. 过境费：订单里填了正数就用（dispatch 以 USD 数字存入），
    //    为 0/空时回溯派车单预设，并按预设单位折算（修复：此前忽略 ZMW 单位）
    let transitUSD = 0;
    const orderTransit = (o.transit !== undefined && o.transit !== null && o.transit !== '') ? Number(o.transit) : NaN;
    if (!isNaN(orderTransit) && orderTransit > 0) {
        transitUSD = orderTransit;
    } else if (o.borderFee) {
        transitUSD = Number(o.borderFee) || 0;
    } else if (dData.transit && dData.transit.val !== undefined) {
        const tv = Number(dData.transit.val) || 0;
        transitUSD = (dData.transit.unit === 'ZMW') ? (tv / rate) : tv;
    }
    // --- 修复逻辑结束 ---

    // 3. 燃油成本
    const liters = Number(o.fuelTotal || o.totalFuel || 0);
    const fuelCostUSD = liters * fPrice;

    // 5. 路上费用明细（OA 审批回写 + 调度手工录入），每笔按自身发生时汇率折算
    const exp = collectExpenses(o);

    // 6. 手动添加的其他费用（存了当时汇率就按当时汇率）
    let manualUSD = 0;
    if(o.manualExtra) {
        const mRate = Number(o.manualExtra.rate) || rate;
        manualUSD = (o.manualExtra.unit === 'ZMW') ? (Number(o.manualExtra.val) / mRate) : Number(o.manualExtra.val);
    }

    // 7. 天数计算
    const start = o.startTime || 0;
    const end = o.archivedAt || o.finishTime || Date.now();
    const days = start ? ((end - start) / (1000 * 60 * 60 * 24)).toFixed(1) : "-";

    const totalCost = fuelCostUSD + transitUSD + roadExpenseUSD + manualUSD + exp.usd;
    const gross = (revenueUSD - totalCost).toFixed(2);

    return { revenueUSD, fuelCostUSD, transitUSD, roadExpenseUSD, manualUSD, expUSD: exp.usd, expCount: exp.count, expDetail: exp.detail, gross, days, liters, rate };
}

function render(dateF = '', keyF = '') {
    tableBody.innerHTML = '';
    // 如果还没加载完数据，暂不渲染
    if (Object.keys(allOrders).length === 0 && Object.keys(allDispatch).length === 0) {
         tableBody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;color:#999">正在同步云端数据...</td></tr>';
         return;
    }

    const entries = Object.entries(allOrders).reverse();
    
    entries.forEach(([id, o]) => {
        const dateStr = o.archivedAt ? new Date(o.archivedAt).toLocaleDateString() : '-';
        const searchStr = `${o.orderId} ${o.customer} ${o.tractor} ${o.driver}`.toLowerCase();

        // 修复：日期筛选。dateF 是 YYYY-MM-DD，需把归档时间转成同格式比较，而不是用本地化字符串 includes
        let matchDate = true;
        if (dateF) {
            if (!o.archivedAt) {
                matchDate = false;
            } else {
                const d = new Date(o.archivedAt);
                const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                matchDate = (ymd === dateF);
            }
        }

        if ((!keyF || searchStr.includes(keyF.toLowerCase())) && matchDate) {
            const fin = computeFinance(o);
            const totalKm = (Number(o.loadedKm) || 0) + (Number(o.emptyKm) || 0); // 修复：运算符优先级
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${o.orderId || id}</b><br><small>${o.driver || '-'}</small></td>
                <td>${o.customer || '-'}<br><small style="color:var(--accent)">${o.tractor || '-'}</small></td>
                <td>${fin.days} 天</td>
                <td>${totalKm} Km<br><small>${fin.liters.toFixed(1)} L</small></td>
                <td style="color:var(--accent); font-weight:bold">$${fin.revenueUSD.toFixed(2)}</td>
                <td>$${fin.transitUSD.toFixed(2)}</td>
                <td>$${fin.fuelCostUSD.toFixed(2)}</td>
                <td>$${fin.roadExpenseUSD.toFixed(2)}</td>
                <td title="${fin.expDetail.join(' | ').replace(/"/g,'')}">
                    ${fin.expCount ? `<b>$${fin.expUSD.toFixed(2)}</b><br><small style="color:#888">${fin.expCount} 笔${fin.expDetail.some(d=>d.includes('(OA)')) ? ' · 含OA' : ''}</small>` : '<span style="color:#bbb">-</span>'}
                </td>
                <td>
                    <div class="extra-input-group">
                        <input type="number" class="input-mini" id="ev-${id}" value="${o.manualExtra?.val || 0}">
                        <select id="eu-${id}" style="font-size:10px">
                            <option value="USD" ${o.manualExtra?.unit==='USD'?'selected':''}>$</option>
                            <option value="ZMW" ${o.manualExtra?.unit==='ZMW'?'selected':''}>K</option>
                        </select>
                        <button class="btn-save" onclick="saveExtra('${id}')">存</button>
                    </div>
                </td>
                <td><span class="badge-gp ${fin.gross >= 0 ? 'gp-pos' : 'gp-neg'}">$${fin.gross}</span></td>
                <td>${dateStr}<br><small style="color:#aaa">汇率 ${fin.rate.toFixed(2)}</small></td>
            `;
            tableBody.appendChild(row);
        }
    });
}

// 保存手动费用（同时快照当时汇率，纳入审计）
window.saveExtra = async (id) => {
    const val = document.getElementById(`ev-${id}`).value;
    const unit = document.getElementById(`eu-${id}`).value;
    const rate = rateOf(Date.now());
    try {
        await update(ref(db, `tms/completed_orders/${id}`), {
            manualExtra: { val: Number(val), unit: unit, rate: rate, ts: Date.now(), by: TMS.session.name() }
        });
        TMS.audit.log('其他费用修改', `订单 ${id}`, `${val} ${unit}（汇率 ${rate}）`);
        alert("费用已更新");
    } catch(e) { alert("失败: " + e.message); }
};

// 监听 completed_orders
onValue(ref(db, "tms/completed_orders"), (snapshot) => {
    allOrders = snapshot.val() || {};
    render();
});

// 新增：同时监听 dispatch 以获取原始预设费用
onValue(ref(db, "tms/dispatch"), (snapshot) => {
    allDispatch = snapshot.val() || {};
    indexDispatch();
    render();
});

searchBtn.addEventListener('click', () => {
    render(document.getElementById('dateFilter').value, document.getElementById('keyword').value);
});

// 兜底汇率 / 燃油单价变动后重算
[exRateIn, fuelPriceIn].forEach(el => el.addEventListener('change', () => {
    render(document.getElementById('dateFilter').value, document.getElementById('keyword').value);
}));

document.getElementById('exportBtn').addEventListener('click', () => {
    let csv = "\uFEFF订单号,客户,车牌,完成天数,里程,油耗,运费(USD),过境费(USD),燃油成本(USD),路上费用(USD),OA明细(USD),其他费用(USD),毛利(USD),汇率,日期\n";
    Object.values(allOrders).forEach(o => {
        const f = computeFinance(o);
        csv += [
            o.orderId, o.customer, o.tractor, f.days,
            (Number(o.loadedKm)||0)+(Number(o.emptyKm)||0), f.liters,
            f.revenueUSD.toFixed(2), f.transitUSD.toFixed(2), f.fuelCostUSD.toFixed(2),
            f.roadExpenseUSD.toFixed(2), f.expUSD.toFixed(2), f.manualUSD.toFixed(2), f.gross,
            f.rate.toFixed(2), o.archivedAt ? TMS.util.ymd(o.archivedAt) : '-'
        ].map(v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"').join(',') + '\n';
    });
    TMS.util.download(`Report_${TMS.util.today()}.csv`, csv);
});
</script>
</body>
</html>
