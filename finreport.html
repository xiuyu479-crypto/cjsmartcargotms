<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车队费用统计报表 - TMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/report.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/tms-core.js"></script>
<script>// 登录即可查看（访客账号除外）
TMS.session.requireLogin();
if (TMS.session.role() === 'viewer') { alert('权限不足：访客无法查看车队费用报表。'); location.replace('index.html'); }</script>
</head>
<body>

<div class="rp-bar">
    <h1><i class="bi bi-graph-up-arrow"></i> 车队费用统计报表 <span class="sub">多维度 · 实时</span></h1>
    <div class="spacer"></div>
    <button class="rp-btn ghost" onclick="location.href='index.html'"><i class="bi bi-arrow-left"></i> 返回主页</button>
    <button class="rp-btn ghost" onclick="location.href='fleetcost.html'"><i class="bi bi-cash-stack"></i> 车队财务</button>
</div>

<div class="rp-wrap">
    <div class="rp-card">
        <div class="rp-filters">
            <div><label>开始日期</label><input type="date" id="fFrom"></div>
            <div><label>结束日期</label><input type="date" id="fTo"></div>
            <div><label>车辆</label><select id="fPlate"><option value="">全部</option></select></div>
            <div><label>显示币种</label>
                <select id="fUnit">
                    <option value="ZMW">ZMW（按当日汇率折）</option>
                    <option value="USD">USD（按当日汇率折）</option>
                </select>
            </div>
            <button class="rp-btn" onclick="applyFilter()"><i class="bi bi-funnel"></i> 刷新报表</button>
            <button class="rp-btn ghost" onclick="quick('all')">全部</button>
            <button class="rp-btn ghost" onclick="quick('month')">本月</button>
            <button class="rp-btn ghost" onclick="quick('last30')">近 30 天</button>
            <button class="rp-btn ghost" onclick="quick('year')">本年</button>
            <button class="rp-btn ghost" onclick="exportDetail()"><i class="bi bi-download"></i> 导出明细</button>
        </div>
        <div class="rp-note" style="margin:12px 0 0">
            金额按每笔记录发生时的汇率折算（旧记录无汇率快照时按当前汇率）。数据源：车队财务流水（充值 / 支出）。
        </div>
    </div>

    <div class="rp-kpis">
        <div class="rp-kpi"><div class="k">总支出</div><div class="v money" id="kSpend">0</div><div class="t" id="kSpendT">-</div></div>
        <div class="rp-kpi"><div class="k">总充值</div><div class="v" id="kRecharge">0</div><div class="t" id="kRechargeT">-</div></div>
        <div class="rp-kpi"><div class="k">支出/充值</div><div class="v" id="kRatio">0%</div><div class="t">消耗率</div></div>
        <div class="rp-kpi"><div class="k">笔数</div><div class="v" id="kCount">0</div><div class="t" id="kCountT">-</div></div>
        <div class="rp-kpi"><div class="k">单车最高支出</div><div class="v" id="kTopPlate" style="font-size:16px">-</div><div class="t" id="kTopPlateT">-</div></div>
    </div>

    <div class="rp-card">
        <h2><i class="bi bi-bar-chart"></i> 月度趋势</h2>
        <div class="rp-chart"><canvas id="cTrend"></canvas></div>
    </div>

    <div class="rp-grid-2">
        <div class="rp-card">
            <h2><i class="bi bi-truck"></i> 按车辆</h2>
            <div class="rp-chart sm"><canvas id="cPlate"></canvas></div>
        </div>
        <div class="rp-card">
            <h2><i class="bi bi-pie-chart"></i> 按事由</h2>
            <div class="rp-chart sm"><canvas id="cReason"></canvas></div>
        </div>
    </div>

    <div class="rp-grid-2">
        <div class="rp-card">
            <h2><i class="bi bi-person"></i> 按申请人</h2>
            <div class="rp-chart sm"><canvas id="cUser"></canvas></div>
        </div>
        <div class="rp-card">
            <h2><i class="bi bi-wallet2"></i> 币种构成（原始金额）</h2>
            <div class="rp-chart sm"><canvas id="cCur"></canvas></div>
        </div>
    </div>

    <div class="rp-card">
        <h2><i class="bi bi-list-ul"></i> 明细分组（按车牌）</h2>
        <div class="rp-table-wrap" style="max-height:420px">
            <table class="rp-table">
                <thead><tr><th>车辆</th><th class="num">支出</th><th class="num">笔数</th><th class="num">占比</th></tr></thead>
                <tbody id="plateTable"><tr><td colspan="4" class="rp-empty">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDEbePpsrXwD8Okqa93UOGUFE37c8SFHS0",
    authDomain: "cjsmartcargo-datebase.firebaseapp.com",
    databaseURL: "https://cjsmartcargo-datebase-default-rtdb.firebaseio.com",
    projectId: "cjsmartcargo-datebase",
    storageBucket: "cjsmartcargo-datebase.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const esc = TMS.util.esc;

let LOGS = [];
let RATES = [];
let charts = {};

onValue(ref(db, 'tms/fleetFinance/logs'), snap => {
    const raw = snap.val() || {};
    LOGS = Object.keys(raw).map(k => Object.assign({ _key: k }, raw[k]));
    buildPlateOptions();
    applyFilter();
});

onValue(ref(db, 'tms/fx/rates'), snap => {
    RATES = TMS.fx.normalize(snap.val());
    applyFilter();
});

function rateOf(ts) {
    return RATES.length ? TMS.fx.rateAt(RATES, ts) : TMS.fx.DEFAULT;
}

/* ---------------- 日期快捷 ---------------- */
function setRange(from, to) {
    document.getElementById('fFrom').value = from;
    document.getElementById('fTo').value = to;
}

window.quick = (mode) => {
    const today = new Date();
    if (mode === 'all') {
        setRange('', '');
    } else if (mode === 'month') {
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        setRange(TMS.util.ymd(first), TMS.util.ymd(today));
    } else if (mode === 'last30') {
        const from = new Date(today.getTime() - 29 * 86400000);
        setRange(TMS.util.ymd(from), TMS.util.ymd(today));
    } else {
        setRange(today.getFullYear() + '-01-01', TMS.util.ymd(today));
    }
    applyFilter();
};

function buildPlateOptions() {
    const sel = document.getElementById('fPlate');
    const cur = sel.value;
    const plates = Array.from(new Set(LOGS.map(l => l.plate).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">全部</option>' + plates.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    sel.value = plates.indexOf(cur) >= 0 ? cur : '';
}

/* ---------------- 汇总 ---------------- */
function currentData() {
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    const plate = document.getElementById('fPlate').value;
    const unit = document.getElementById('fUnit').value;

    return LOGS.filter(l => {
        const day = TMS.util.ymd(l.createdAt);
        if (from && day < from) return false;
        if (to && day > to) return false;
        if (plate && l.plate !== plate) return false;
        return true;
    }).map(l => {
        const r = Number(l.rate) || rateOf(l.createdAt);
        const cur = (l.currency || 'ZMW').toUpperCase();
        const amount = Number(l.amount) || 0;
        const usd = cur === 'USD' ? amount : amount / r;
        const zmw = cur === 'ZMW' ? amount : amount * r;
        return Object.assign({}, l, {
            _rate: r,
            _cur: cur,
            _usd: usd,
            _zmw: zmw,
            _val: unit === 'USD' ? usd : zmw,
            _isSpend: l.type === 'spend',
            _reason: (l.reason || '未填写').trim() || '未填写'
        });
    });
}

function sum(arr) { return arr.reduce((s, x) => s + x, 0); }

window.applyFilter = () => {
    const unit = document.getElementById('fUnit').value;
    const sym = unit === 'USD' ? '$' : 'K';
    const rows = currentData();
    const spends = rows.filter(r => r._isSpend);
    const recharges = rows.filter(r => r.type === 'recharge');

    const spendTotal = sum(spends.map(r => r._val));
    const rechargeTotal = sum(recharges.map(r => r._val));

    // KPI
    document.getElementById('kSpend').innerText = sym + spendTotal.toFixed(2);
    document.getElementById('kSpendT').innerText = `${spends.length} 笔支出`;
    document.getElementById('kRecharge').innerText = sym + rechargeTotal.toFixed(2);
    document.getElementById('kRechargeT').innerText = `${recharges.length} 笔充值`;
    document.getElementById('kRatio').innerText = rechargeTotal > 0 ? ((spendTotal / rechargeTotal) * 100).toFixed(1) + '%' : '-';
    document.getElementById('kCount').innerText = rows.length;
    document.getElementById('kCountT').innerText = unit === 'USD' ? '折 USD' : '折 ZMW';

    // 单车最高支出（排除办公室/非车辆支出）
    const byPlate = groupSum(spends, r => r.plate || 'OFFICE/OTHER');
    const vehicleSpend = groupSum(spends.filter(r => r.plate && r.plate !== 'OFFICE/OTHER'), r => r.plate);
    const top = Object.entries(vehicleSpend).sort((a, b) => b[1].val - a[1].val)[0];
    document.getElementById('kTopPlate').innerText = top ? top[0] : '-';
    document.getElementById('kTopPlateT').innerText = top ? sym + top[1].val.toFixed(2) + ` · ${top[1].count} 笔` : '-';

    // 图表
    drawTrend(spends, recharges, unit);
    drawPlate(byPlate, sym);
    drawReason(spends, sym);
    drawUser(spends, sym);
    drawCurrency(spends, recharges);

    // 表格
    const tbody = document.getElementById('plateTable');
    const entries = Object.entries(byPlate).sort((a, b) => b[1].val - a[1].val);
    if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="rp-empty">该区间没有支出记录</td></tr>';
    } else {
        tbody.innerHTML = entries.map(([plate, v]) => `
            <tr>
                <td><b>${esc(plate)}</b></td>
                <td class="num">${sym}${v.val.toFixed(2)}</td>
                <td class="num">${v.count}</td>
                <td class="num">${spendTotal > 0 ? ((v.val / spendTotal) * 100).toFixed(1) + '%' : '-'}</td>
            </tr>`).join('');
    }
};

function groupSum(rows, keyFn) {
    const out = {};
    rows.forEach(r => {
        const k = keyFn(r) || '-';
        if (!out[k]) out[k] = { val: 0, count: 0 };
        out[k].val += r._val;
        out[k].count++;
    });
    return out;
}

/* ---------------- 图表 ---------------- */
function destroy(name) {
    if (charts[name]) { charts[name].destroy(); delete charts[name]; }
}

function drawTrend(spends, recharges, unit) {
    const months = [];
    const now = new Date();
    for (let i = 11; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
    }
    const spendMap = {}, recMap = {};
    spends.forEach(r => { const m = TMS.util.ym(r.createdAt); spendMap[m] = (spendMap[m] || 0) + r._val; });
    recharges.forEach(r => { const m = TMS.util.ym(r.createdAt); recMap[m] = (recMap[m] || 0) + r._val; });

    destroy('trend');
    charts.trend = new Chart(document.getElementById('cTrend'), {
        type: 'bar',
        data: {
            labels: months,
            datasets: [
                { label: '支出', data: months.map(m => +(spendMap[m] || 0).toFixed(2)), backgroundColor: '#1e63d8', borderRadius: 4 },
                { label: '充值', data: months.map(m => +(recMap[m] || 0).toFixed(2)), backgroundColor: '#9dbcf5', borderRadius: 4 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${unit === 'USD' ? '$' : 'K'}${c.parsed.y}` } } },
            scales: { y: { beginAtZero: true, grid: { color: '#f0f1f4' } }, x: { grid: { display: false } } }
        }
    });
}

function drawPlate(byPlate, sym) {
    const entries = Object.entries(byPlate).sort((a, b) => b[1].val - a[1].val).slice(0, 10);
    destroy('plate');
    charts.plate = new Chart(document.getElementById('cPlate'), {
        type: 'bar',
        data: {
            labels: entries.map(e => e[0]),
            datasets: [{ label: '支出', data: entries.map(e => +e[1].val.toFixed(2)), backgroundColor: '#1e63d8', borderRadius: 4 }]
        },
        options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => sym + c.parsed.x } } },
            scales: { x: { beginAtZero: true, grid: { color: '#f0f1f4' } }, y: { grid: { display: false } } }
        }
    });
}

function drawReason(spends, sym) {
    const byReason = groupSum(spends, r => r._reason);
    let entries = Object.entries(byReason).sort((a, b) => b[1].val - a[1].val);
    if (entries.length > 8) {
        const top = entries.slice(0, 7);
        const rest = entries.slice(7).reduce((s, e) => s + e[1].val, 0);
        entries = top.concat([['其他', { val: rest, count: 0 }]]);
    }
    destroy('reason');
    charts.reason = new Chart(document.getElementById('cReason'), {
        type: 'doughnut',
        data: {
            labels: entries.map(e => e[0].length > 14 ? e[0].slice(0, 14) + '…' : e[0]),
            datasets: [{
                data: entries.map(e => +e[1].val.toFixed(2)),
                backgroundColor: ['#1e63d8', '#4b8bf0', '#7aa9f5', '#b45309', '#d92d20', '#12805c', '#8b5cf6', '#94a3b8'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, cutout: '58%',
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: c => `${c.label}: ${sym}${c.parsed}` } } }
        }
    });
}

function drawUser(spends, sym) {
    const byUser = groupSum(spends, r => r.user || r.createdBy || '未填写');
    const entries = Object.entries(byUser).sort((a, b) => b[1].val - a[1].val).slice(0, 8);
    destroy('user');
    charts.user = new Chart(document.getElementById('cUser'), {
        type: 'bar',
        data: {
            labels: entries.map(e => e[0]),
            datasets: [{ label: '支出', data: entries.map(e => +e[1].val.toFixed(2)), backgroundColor: '#12805c', borderRadius: 4 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => sym + c.parsed.y } } },
            scales: { y: { beginAtZero: true, grid: { color: '#f0f1f4' } }, x: { grid: { display: false } } }
        }
    });
}

function drawCurrency(spends, recharges) {
    const zmw = sum(spends.filter(r => r._cur === 'ZMW').map(r => r.amount)) + sum(recharges.filter(r => r._cur === 'ZMW').map(r => r.amount));
    const usd = sum(spends.filter(r => r._cur === 'USD').map(r => r.amount)) + sum(recharges.filter(r => r._cur === 'USD').map(r => r.amount));

    destroy('cur');
    charts.cur = new Chart(document.getElementById('cCur'), {
        type: 'doughnut',
        data: {
            labels: ['ZMW 原币合计', 'USD 原币合计'],
            datasets: [{ data: [+zmw.toFixed(2), +usd.toFixed(2)], backgroundColor: ['#1e63d8', '#b45309'], borderWidth: 0 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false, cutout: '58%',
            plugins: {
                legend: { position: 'bottom' },
                tooltip: { callbacks: { label: c => `${c.label}: ${c.label.indexOf('USD') === 0 ? '$' : 'K'}${c.parsed}` } }
            }
        }
    });
}

/* ---------------- 导出 ---------------- */
window.exportDetail = () => {
    const rows = currentData();
    let csv = '日期,类型,币种,原币金额,汇率,折USD,车牌,申请人,录入人,事由,状态\n';
    rows.sort((a, b) => Number(a.createdAt) - Number(b.createdAt)).forEach(r => {
        csv += [
            TMS.util.ymd(r.createdAt), r._isSpend ? '支出' : '充值', r._cur, r.amount, r._rate.toFixed(4),
            r._usd.toFixed(2), r.plate || '', r.user || '', r.createdBy || '', r.reason || r.note || '', r.status || ''
        ].map(v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"').join(',') + '\n';
    });
    TMS.util.download(`FleetCost_${TMS.util.today()}.csv`, csv);
};

/* ---------------- 初始化 ---------------- */
document.getElementById('fUnit').addEventListener('change', applyFilter);
document.getElementById('fPlate').addEventListener('change', applyFilter);
document.getElementById('fFrom').addEventListener('change', applyFilter);
document.getElementById('fTo').addEventListener('change', applyFilter);

quick('all');
// 数据未到时的兜底渲染
setTimeout(() => { if (!LOGS.length) applyFilter(); }, 800);
</script>
</body>
</html>
