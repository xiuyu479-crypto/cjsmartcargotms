<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单车毛利分析 - TMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/report.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/tms-core.js"></script>
<script>TMS.session.requireRole(['admin']);</script>
</head>
<body>

<div class="rp-bar">
    <h1><i class="bi bi-pie-chart"></i> 单车 / 线路毛利分析 <span class="sub">收入 − 直接成本</span></h1>
    <div class="spacer"></div>
    <button class="rp-btn ghost" onclick="location.href='completed.html'"><i class="bi bi-file-earmark-text"></i> 订单财务明细</button>
    <button class="rp-btn ghost" onclick="location.href='index.html'"><i class="bi bi-arrow-left"></i> 返回主页</button>
</div>

<div class="rp-wrap">
    <div class="rp-card">
        <div class="rp-filters">
            <div><label>开始日期</label><input type="date" id="fFrom"></div>
            <div><label>结束日期</label><input type="date" id="fTo"></div>
            <div><label>燃油单价 (USD/L)</label><input type="number" step="0.01" id="fFuel" value="1.17" style="width:110px"></div>
            <div style="padding-bottom:8px">
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin:0;cursor:pointer">
                    <input type="checkbox" id="fOnlyRev" checked style="width:auto"> 仅统计有运费的订单
                </label>
            </div>
            <button class="rp-btn" onclick="renderAll()"><i class="bi bi-arrow-repeat"></i> 重新计算</button>
            <button class="rp-btn ghost" onclick="quick('all')">全部</button>
            <button class="rp-btn ghost" onclick="quick('month')">本月</button>
            <button class="rp-btn ghost" onclick="quick('quarter')">本季</button>
            <button class="rp-btn ghost" onclick="quick('year')">本年</button>
        </div>
        <div class="rp-note" style="margin:12px 0 0">
            口径：收入=客户运费（按完成时汇率折 USD）；直接成本=燃油+过境费+Trip Money+Bonus+司机津贴+OA路上费用+手工其他费用。
            车队账户支出（充值/报销）为独立核算口径，仅作参考，不参与毛利计算。
        </div>
    </div>

    <div class="rp-kpis">
        <div class="rp-kpi"><div class="k">总收入</div><div class="v money" id="kRev">$0</div><div class="t" id="kOrders">0 单</div></div>
        <div class="rp-kpi"><div class="k">直接成本</div><div class="v" id="kCost">$0</div><div class="t" id="kCostT">-</div></div>
        <div class="rp-kpi"><div class="k">毛利</div><div class="v pos" id="kGross">$0</div><div class="t">收入 − 成本</div></div>
        <div class="rp-kpi"><div class="k">毛利率</div><div class="v" id="kMargin">0%</div><div class="t">毛利 / 收入</div></div>
        <div class="rp-kpi"><div class="k">单均毛利</div><div class="v" id="kAvg">$0</div><div class="t">每单</div></div>
    </div>

    <div class="rp-card">
        <h2><i class="bi bi-graph-up"></i> 月度收入 / 成本 / 毛利</h2>
        <div class="rp-chart"><canvas id="cMonth"></canvas></div>
    </div>

    <div class="rp-card">
        <h2><i class="bi bi-truck"></i> 按车辆</h2>
        <div class="rp-table-wrap" style="max-height:44vh">
            <table class="rp-table">
                <thead>
                    <tr>
                        <th>车辆</th><th class="num">单数</th><th class="num">收入</th><th class="num">直接成本</th>
                        <th class="num">毛利</th><th class="num">毛利率</th><th class="num">车队账户支出<br><small class="muted">（参考）</small></th>
                    </tr>
                </thead>
                <tbody id="tbodyPlate"><tr><td colspan="7" class="rp-empty">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="rp-card">
        <h2><i class="bi bi-signpost-split"></i> 按线路</h2>
        <div class="rp-table-wrap" style="max-height:44vh">
            <table class="rp-table">
                <thead>
                    <tr><th>线路</th><th class="num">单数</th><th class="num">收入</th><th class="num">直接成本</th><th class="num">毛利</th><th class="num">毛利率</th><th class="num">单均毛利</th></tr>
                </thead>
                <tbody id="tbodyRoute"><tr><td colspan="7" class="rp-empty">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDEbePpsrXwD8Okqa93UOGUFE37c8SFHS0",
    authDomain: "cjsmartcargo-datebase.firebaseapp.com",
    databaseURL: "https://cjsmartcargo-datebase-default-rtdb.firebaseio.com",
    projectId: "cjsmartcargo-datebase",
    storageBucket: "cjsmartcargo-datebase.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const esc = TMS.util.esc;

let ORDERS = {}, DISPATCH = {}, FLEET = {}, RATES = [];
let dispatchByOrder = {};
let chartMonth = null;

function indexDispatch() {
    dispatchByOrder = {};
    Object.keys(DISPATCH).forEach(k => {
        const d = DISPATCH[k] || {};
        if (d.confirmedOrderId) dispatchByOrder[d.confirmedOrderId] = d;
    });
}

onValue(ref(db, 'tms/completed_orders'), s => { ORDERS = s.val() || {}; renderAll(); });
onValue(ref(db, 'tms/dispatch'), s => { DISPATCH = s.val() || {}; indexDispatch(); renderAll(); });
onValue(ref(db, 'tms/fleetFinance/logs'), s => { FLEET = s.val() || {}; renderAll(); });
onValue(ref(db, 'tms/fx/rates'), s => { RATES = TMS.fx.normalize(s.val()); renderAll(); });

function rateOf(ts) { return RATES.length ? TMS.fx.rateAt(RATES, ts) : TMS.fx.DEFAULT; }

function expensesUSD(o, ts) {
    const raw = o.expenses;
    const list = Array.isArray(raw) ? raw : (raw && typeof raw === 'object' ? Object.values(raw) : []);
    return list.reduce((sum, e) => {
        if (!e) return sum;
        const r = Number(e.rate) || rateOf(Number(e.ts || e.time) || ts);
        const unit = (e.currency || 'ZMW').toUpperCase();
        const amt = Number(e.amount) || 0;
        const usd = (e.usd !== undefined && e.usd !== null && e.usd !== '') ? Number(e.usd) : (unit === 'USD' ? amt : amt / r);
        return sum + usd;
    }, 0);
}

function orderFinance(o) {
    const ts = Number(o.archivedAt) || Number(o.startTime) || Date.now();
    const rate = rateOf(ts);
    const d = DISPATCH[o.relDispatchId] || dispatchByOrder[o.orderId] || {};
    const fuelPrice = Number(document.getElementById('fFuel').value) || 1.17;

    const fRateObj = o.fRate || d.fRate || {};
    const revVal = Number(fRateObj.val || o.totalFee || 0);
    const rev = (fRateObj.unit || 'USD').toUpperCase() === 'ZMW' ? revVal / rate : revVal;

    const fTripObj = o.fTrip || d.fTrip || {};
    const tripRaw = Number(fTripObj.val || o.tripMoney || 0);
    const trip = (fTripObj.unit || 'ZMW').toUpperCase() === 'ZMW' ? tripRaw / rate : tripRaw;

    const fBonusObj = o.fBonus || d.fBonus || {};
    const bonusRaw = Number(fBonusObj.val || 0);
    const bonus = (fBonusObj.unit || 'ZMW').toUpperCase() === 'ZMW' ? bonusRaw / rate : bonusRaw;

    const allow = (Number(o.allowance) || 0) / rate;

    let transit = 0;
    if (o.transit !== undefined && o.transit !== null && o.transit !== '' && Number(o.transit) > 0) transit = Number(o.transit);
    else if (d.transit && d.transit.val !== undefined) {
        transit = (d.transit.unit || 'USD').toUpperCase() === 'ZMW' ? Number(d.transit.val) / rate : Number(d.transit.val);
    }

    const fuel = (Number(o.fuelTotal || o.totalFuel) || 0) * fuelPrice;
    const oaExp = expensesUSD(o, ts);
    let manual = 0;
    if (o.manualExtra) {
        const mr = Number(o.manualExtra.rate) || rate;
        manual = (o.manualExtra.unit || 'USD').toUpperCase() === 'ZMW' ? Number(o.manualExtra.val) / mr : Number(o.manualExtra.val);
    }

    const cost = fuel + transit + trip + bonus + allow + oaExp + manual;
    return {
        ts, rate, rev, cost, gross: rev - cost,
        plate: o.tractor || '未填写车辆',
        route: o.route || [o.pickupAddr, o.dropoffAddr].filter(Boolean).join(' → ') || '未填写线路'
    };
}

function rowsInRange() {
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    const onlyRev = document.getElementById('fOnlyRev').checked;
    return Object.keys(ORDERS).map(id => {
        const o = ORDERS[id];
        const f = orderFinance(o);
        return Object.assign({ id, o, day: TMS.util.ymd(f.ts) }, f);
    }).filter(r => (!from || r.day >= from) && (!to || r.day <= to))
      .filter(r => !onlyRev || r.rev > 0);
}

// 统计区间内被"运费为 0"过滤掉的单数，避免毛利率被失真
function excludedCount() {
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    return Object.keys(ORDERS).filter(id => {
        const f = orderFinance(ORDERS[id]);
        const day = TMS.util.ymd(f.ts);
        return (!from || day >= from) && (!to || day <= to) && f.rev <= 0;
    }).length;
}

/* 车队账户支出（独立口径，按车牌汇总，USD 折算） */
function fleetSpendByPlate(from, to) {
    const out = {};
    Object.values(FLEET).forEach(l => {
        if (!l || l.type !== 'spend') return;
        const day = TMS.util.ymd(l.createdAt);
        if (from && day < from) return;
        if (to && day > to) return;
        const r = Number(l.rate) || rateOf(l.createdAt);
        const usd = l.usdValue !== undefined ? Number(l.usdValue) : ((l.currency || 'ZMW').toUpperCase() === 'USD' ? Number(l.amount) : Number(l.amount) / r);
        const p = l.plate || 'OFFICE/OTHER';
        out[p] = (out[p] || 0) + usd;
    });
    return out;
}

function group(rows, keyFn) {
    const map = {};
    rows.forEach(r => {
        const k = keyFn(r);
        if (!map[k]) map[k] = { count: 0, rev: 0, cost: 0, gross: 0 };
        map[k].count++;
        map[k].rev += r.rev;
        map[k].cost += r.cost;
        map[k].gross += r.gross;
    });
    return map;
}

function money(n) {
    const v = Number(n) || 0;
    const sign = v < 0 ? '-' : '';
    return sign + '$' + Math.abs(v).toFixed(2);
}

function marginCell(gross, rev) {
    if (rev <= 0) return '<span class="rp-tag gray">-</span>';
    const m = (gross / rev) * 100;
    const cls = m >= 25 ? 'ok' : (m >= 0 ? 'warn' : 'bad');
    return `<span class="rp-tag ${cls}">${m.toFixed(1)}%</span>`;
}

function grossCell(v) {
    // 中国习惯：盈利红色，亏损绿色
    return `<span style="color:${v >= 0 ? 'var(--c-danger)' : 'var(--c-success)'};font-weight:700">${money(v)}</span>`;
}

window.renderAll = () => {
    const rows = rowsInRange();
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;

    const rev = rows.reduce((s, r) => s + r.rev, 0);
    const cost = rows.reduce((s, r) => s + r.cost, 0);
    const gross = rev - cost;

    document.getElementById('kRev').innerText = money(rev);
    const excluded = document.getElementById('fOnlyRev').checked ? excludedCount() : 0;
    document.getElementById('kOrders').innerText = rows.length + ' 单' + (excluded ? '（另有 ' + excluded + ' 单未填运费）' : '');
    document.getElementById('kCost').innerText = money(cost);
    document.getElementById('kCostT').innerText = rows.length ? '单均 ' + money(cost / rows.length) : '-';
    const gEl = document.getElementById('kGross');
    gEl.innerText = money(gross);
    gEl.className = 'v ' + (gross >= 0 ? 'pos' : 'neg');

    document.getElementById('kMargin').innerText = rev > 0 ? ((gross / rev) * 100).toFixed(1) + '%' : '-';

    const avgEl = document.getElementById('kAvg');
    const avg = rows.length ? gross / rows.length : 0;
    avgEl.innerText = rows.length ? money(avg) : '-';
    avgEl.className = 'v ' + (avg >= 0 ? 'pos' : 'neg');

    // 按车辆
    const byPlate = group(rows, r => r.plate);
    const fleet = fleetSpendByPlate(from, to);
    const plateEntries = Object.entries(byPlate).sort((a, b) => b[1].gross - a[1].gross);
    document.getElementById('tbodyPlate').innerHTML = plateEntries.length ? plateEntries.map(([k, v]) => `
        <tr>
            <td><b>${esc(k)}</b></td>
            <td class="num">${v.count}</td>
            <td class="num">${money(v.rev)}</td>
            <td class="num">${money(v.cost)}</td>
            <td class="num">${grossCell(v.gross)}</td>
            <td class="num">${marginCell(v.gross, v.rev)}</td>
            <td class="num muted">${money(fleet[k] || 0)}</td>
        </tr>`).join('') : '<tr><td colspan="7" class="rp-empty">该区间没有已完成订单</td></tr>';

    // 按线路
    const byRoute = group(rows, r => r.route);
    const routeEntries = Object.entries(byRoute).sort((a, b) => b[1].gross - a[1].gross);
    document.getElementById('tbodyRoute').innerHTML = routeEntries.length ? routeEntries.map(([k, v]) => `
        <tr>
            <td><b>${esc(k)}</b></td>
            <td class="num">${v.count}</td>
            <td class="num">${money(v.rev)}</td>
            <td class="num">${money(v.cost)}</td>
            <td class="num">${grossCell(v.gross)}</td>
            <td class="num">${marginCell(v.gross, v.rev)}</td>
            <td class="num">${money(v.gross / v.count)}</td>
        </tr>`).join('') : '<tr><td colspan="7" class="rp-empty">该区间没有已完成订单</td></tr>';

    drawMonth(rows);
};

function drawMonth(rows) {
    const map = {};
    rows.forEach(r => {
        const m = TMS.util.ym(r.ts);
        if (!map[m]) map[m] = { rev: 0, cost: 0, gross: 0 };
        map[m].rev += r.rev;
        map[m].cost += r.cost;
        map[m].gross += r.gross;
    });
    const months = Object.keys(map).sort();

    if (chartMonth) chartMonth.destroy();
    chartMonth = new Chart(document.getElementById('cMonth'), {
        data: {
            labels: months.length ? months : ['暂无数据'],
            datasets: [
                { type: 'bar', label: '收入', data: months.map(m => +map[m].rev.toFixed(2)), backgroundColor: '#1e63d8', borderRadius: 4, order: 2 },
                { type: 'bar', label: '直接成本', data: months.map(m => +map[m].cost.toFixed(2)), backgroundColor: '#b45309', borderRadius: 4, order: 2 },
                { type: 'line', label: '毛利', data: months.map(m => +map[m].gross.toFixed(2)), borderColor: '#12805c', backgroundColor: '#12805c', tension: .3, order: 1 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: $${c.parsed.y}` } } },
            scales: { y: { beginAtZero: true, grid: { color: '#f0f1f4' } }, x: { grid: { display: false } } }
        }
    });
}

window.quick = (mode) => {
    const today = new Date();
    let from;
    if (mode === 'all') {
        document.getElementById('fFrom').value = '';
        document.getElementById('fTo').value = '';
        renderAll();
        return;
    }
    if (mode === 'month') from = new Date(today.getFullYear(), today.getMonth(), 1);
    else if (mode === 'quarter') from = new Date(today.getFullYear(), Math.floor(today.getMonth() / 3) * 3, 1);
    else from = new Date(today.getFullYear(), 0, 1);
    document.getElementById('fFrom').value = TMS.util.ymd(from);
    document.getElementById('fTo').value = TMS.util.ymd(today);
    renderAll();
};

['fFrom', 'fTo', 'fFuel', 'fOnlyRev'].forEach(id => document.getElementById(id).addEventListener('change', renderAll));
quick('all');
</script>
</body>
</html>
