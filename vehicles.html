<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>车辆档案</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:linear-gradient(135deg,#e9f3ff 0%,#dbe9ff 100%);color:#123;padding:0}
.header{padding:18px;text-align:center;color:#1f4e92;font-weight:600;font-size:20px}
.container{max-width:980px;margin:18px auto;padding:14px}
.card{background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);border-radius:12px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.input{padding:8px;border-radius:8px;border:1px solid #dfe8ff;background:rgba(255,255,255,0.9)}
.label{font-size:13px;color:#345;margin-bottom:6px}
.btn{padding:10px 14px;border-radius:10px;border:none;background:#1e63d8;color:#fff;cursor:pointer}
.secondary{background:#6b7280}
.table{width:100%;border-collapse:collapse;margin-top:12px}
.table th{background:rgba(30,99,216,0.07);text-align:left;padding:10px;border-bottom:1px solid rgba(0,0,0,0.06)}
.table td{padding:10px;border-bottom:1px solid rgba(0,0,0,0.04)}
.actions button{margin-right:6px;padding:6px 10px;border-radius:8px;border:none;cursor:pointer}
.editBtn{background:#f59e0b;color:#fff}
.delBtn{background:#ef4444;color:#fff}
.empty{color:#666;padding:12px}
.langSwitch{position:fixed;top:12px;right:16px}
.langBtn{padding:6px 12px;border-radius:12px;border:none;background:rgba(255,255,255,0.7);cursor:pointer}
.table tr.selected{background:#e8f0ff}
</style>
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/firebase.js"></script>
</head>
<body>
<script>
if(localStorage.getItem("tms_auth") !== "uki1998"){
  const page = location.pathname.split('/').pop();
  window.location.href = "password.html?redirect=" + encodeURIComponent(page);
}
</script>


<div style="position:fixed;top:15px;left:15px;z-index:999;">
  <button onclick="window.location.href='index.html'">返回主页面</button>
</div>

<div class="langSwitch"><button class="langBtn" id="langToggle">English</button></div>
<div class="header" id="title">车辆档案</div>
<div class="container">
  <div class="card">
    <div style="font-weight:600;margin-bottom:8px" id="formTitle">添加车辆</div>
    <div class="form-row">
      <div>
        <div class="label" id="lblHead">车头号</div>
        <input class="input" id="head">
      </div>
      <div>
        <div class="label" id="lblTrailer">拖车号</div>
        <input class="input" id="trailer">
      </div>
      <div>
        <div class="label" id="lblKm">里程数 (Km)</div>
        <input class="input" id="km" type="number" min="0">
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" id="saveBtn">保存</button>
      <button class="btn secondary" id="resetBtn">重置</button>
      <div style="margin-left:auto;color:#666" id="status"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div style="font-weight:600">车辆列表</div>
    <table class="table" id="vehicleTable">
      <thead><tr>
        <th>车头号</th><th>拖车号</th><th>里程数</th><th>操作</th>
      </tr></thead>
      <tbody id="tbody">
      <tr><td colspan="4" class="empty">正在加载...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEbePpsrXwD8Okqa93UOGUFE37c8SFHS0",
  authDomain: "cjsmartcargo-datebase.firebaseapp.com",
  databaseURL: "https://cjsmartcargo-datebase-default-rtdb.firebaseio.com",
  projectId: "cjsmartcargo-datebase",
  storageBucket: "cjsmartcargo-datebase.firebasestorage.app",
  messagingSenderId: "751451468006",
  appId: "1:751451468006:web:a3cbd33cf3c2b29f624b27"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const PATH = 'tms/vehicles';

const headEl = document.getElementById('head');
const trailerEl = document.getElementById('trailer');
const kmEl = document.getElementById('km');
const tbody = document.getElementById('tbody');
const saveBtn = document.getElementById('saveBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
let editingId = null;

const vehiclesRef = ref(db, PATH);
onValue(vehiclesRef, snap=>{
  const data = snap.val() || {};
  renderTable(data);
});

function renderTable(data){
  tbody.innerHTML = '';
  const keys = Object.keys(data);
  if(keys.length===0){
    tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无车辆</td></tr>';
    return;
  }
  keys.forEach(k=>{
    const v = data[k];
    const tr = document.createElement('tr');
    tr.setAttribute('data-id', k);
    tr.innerHTML = `<td>${escapeHtml(v.head||v.truckHead||'')}</td><td>${escapeHtml(v.trailer||v.truckTrailer||'')}</td><td>${escapeHtml(v.km||'')}</td>
      <td><button class="editBtn" data-id="${k}">编辑</button> <button class="delBtn" data-id="${k}">删除</button></td>`;
    tr.addEventListener('click', ()=>{ document.querySelectorAll('#tbody tr').forEach(r=>r.classList.remove('selected')); tr.classList.add('selected'); });
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.editBtn').forEach(b=>b.addEventListener('click', onEdit));
  tbody.querySelectorAll('.delBtn').forEach(b=>b.addEventListener('click', onDelete));
}

function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function onEdit(e){
  const id = e.currentTarget.dataset.id;
  const nodeRef = ref(db, PATH + '/' + id);
  onValue(nodeRef, snap=>{
    const v = snap.val();
    if(!v) return;
    headEl.value = v.head||'';
    trailerEl.value = v.trailer||'';
    kmEl.value = v.km||'';
    editingId = id;
    document.getElementById('formTitle').innerText = '编辑车辆';
  }, {onlyOnce:true});
}

async function onDelete(e){
  const id = e.currentTarget.dataset.id;
  if(!confirm('确认删除此车辆？')) return;
  try{
    await remove(ref(db, PATH + '/' + id));
    statusEl.innerText = '已删除';
  }catch(err){
    console.error(err);
    statusEl.innerText = '删除失败';
  }
}

resetBtn.addEventListener('click', ()=>{
  headEl.value=''; trailerEl.value=''; kmEl.value='';
  editingId = null; document.getElementById('formTitle').innerText='添加车辆';
  statusEl.innerText='';
});

saveBtn.addEventListener('click', async ()=>{
  const payload = { head: headEl.value.trim(), trailer: trailerEl.value.trim(), km: kmEl.value ? parseFloat(kmEl.value) : 0, createdAt: Date.now() };
  if(!payload.head && !payload.trailer){ alert('请输入车头或拖车号'); return;}
  try{
    if(editingId){
      await set(ref(db, PATH + '/' + editingId), payload);
      statusEl.innerText = '已更新';
    } else {
      const p = push(ref(db, PATH));
      await set(p, payload);
      statusEl.innerText = '已添加';
    }
    resetBtn.click();
  }catch(err){
    console.error(err);
    statusEl.innerText = '保存失败';
  }
});

// language
const urlParams = new URLSearchParams(window.location.search);
let lang = urlParams.get('lang') || localStorage.getItem('tms_lang') || 'zh';
const langPack = {
  zh:{title:'车辆档案', formTitleAdd:'添加车辆', lblHead:'车头号', lblTrailer:'拖车号', lblKm:'里程数 (Km)', save:'保存', reset:'重置', noData:'暂无车辆'},
  en:{title:'Vehicle Archive', formTitleAdd:'Add Vehicle', lblHead:'Head No', lblTrailer:'Trailer No', lblKm:'Km', save:'Save', reset:'Reset', noData:'No vehicles'}
};
function applyLang(){
  const t = langPack[lang] || langPack.zh;
  document.getElementById('title').innerText = t.title;
  document.getElementById('formTitle').innerText = editingId ? '编辑车辆' : t.formTitleAdd;
  document.getElementById('lblHead').innerText = t.lblHead;
  document.getElementById('lblTrailer').innerText = t.lblTrailer;
  document.getElementById('lblKm').innerText = t.lblKm;
  saveBtn.innerText = t.save;
  resetBtn.innerText = t.reset;
  const emptyRow = tbody.querySelector('.empty');
  if(emptyRow) emptyRow.innerText = t.noData;
  document.getElementById('langToggle').innerText = lang === 'zh' ? 'English' : '中文';
  localStorage.setItem('tms_lang', lang);
}
document.getElementById('langToggle').addEventListener('click', ()=>{
  lang = lang === 'zh' ? 'en' : 'zh'; applyLang();
});
applyLang();
</script>
</body>
</html>
