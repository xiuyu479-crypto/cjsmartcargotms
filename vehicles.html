<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>车辆与司机管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:linear-gradient(135deg,#e9f3ff 0%,#dbe9ff 100%);color:#123;padding:0}
.header{padding:18px;text-align:center;color:var(--c-text);font-weight:600;font-size:20px}
.container{max-width:1080px;margin:18px auto;padding:14px}
.card{background:rgba(255,255,255,0.78);backdrop-filter:blur(8px);border-radius:12px;padding:14px;box-shadow:0 6px 16px rgba(0,0,0,0.08);margin-bottom:14px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px}
.input{padding:8px;border-radius:8px;border:1px solid #dfe8ff;background:rgba(255,255,255,0.9);width:90%}
.label{font-size:13px;color:#345;margin-bottom:6px}
.btn{padding:10px 14px;border-radius:10px;border:none;background:var(--c-primary);color:#fff;cursor:pointer}
.btn.secondary{background:#6b7280}
.btn.small{padding:4px 10px;font-size:12px;border-radius:6px}
.table{width:100%;border-collapse:collapse;margin-top:12px}
.table th{background:rgba(30,99,216,0.07);text-align:left;padding:10px;border-bottom:1px solid rgba(0,0,0,0.06);font-size:13px;white-space:nowrap}
.table td{padding:10px;border-bottom:1px solid rgba(0,0,0,0.04);vertical-align:top;font-size:13px}
.actions button{margin-right:6px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px}
.editBtn{background:var(--c-primary-soft);color:var(--c-primary);border:1px solid var(--c-primary-soft-border)}
.delBtn{background:var(--c-danger-soft);color:var(--c-danger);border:1px solid #fbd5d1}
.docBtn{background:#fff7e6;color:var(--c-warning);border:1px solid #f6dfb8}
.empty{color:#666;padding:12px}
.langSwitch{position:fixed;top:12px;right:16px}
.langBtn{padding:6px 12px;border-radius:12px;border:none;background:rgba(255,255,255,0.7);cursor:pointer}
.tab-nav {display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;}
.tab-btn {padding: 10px 20px; border-radius: 20px; border: 1px solid var(--c-primary); background: transparent; color: var(--c-primary); cursor: pointer; transition: 0.3s;}
.tab-btn.active {background: var(--c-primary); color: white;}
.section {display: none;}
.section.active {display: block;}

/* 到期提醒标签 */
.exp{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.exp.ok{background:var(--c-success-soft);color:var(--c-success)}
.exp.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.exp.bad{background:var(--c-danger-soft);color:var(--c-danger)}
.exp.none{background:#f2f4f7;color:#98a2b3}

/* 单证弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-box h3{margin:0 0 4px;font-size:16px;color:var(--c-primary)}
.modal-box .sub{font-size:12px;color:#888;margin-bottom:14px}
.doc-grid{display:grid;grid-template-columns:150px 1fr 150px;gap:8px;align-items:center}
.doc-grid .h{font-size:12px;color:#94a3b8;font-weight:700}
.doc-grid input{padding:8px;border:1px solid #dfe8ff;border-radius:8px;width:100%;box-sizing:border-box;font-size:13px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
</style>

<div class="langSwitch"><button class="langBtn" id="langToggle">English</button></div>

  <button class="btn" onclick="window.location.href='index.html'"><i class="bi bi-arrow-left"></i> 返回主页</button>

    <button class="tab-btn active" onclick="switchTab('vehicle')" id="tabVeh">车辆管理</button>

  <div id="vehicleSection" class="section active">
    <div class="card">

<!-- 车辆单证弹窗 -->

  <div class="modal-box">
    <h3>车辆单证 <i class="bi bi-file-earmark-text"></i></h3>

      <div class="h">单证</div><div class="h">编号 / 备注</div><div class="h">到期日</div>

    <div id="docRows"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEbePpsrXwD8Okqa93UOGUFE37c8SFHS0",
  authDomain: "cjsmartcargo-datebase.firebaseapp.com",
  databaseURL: "https://cjsmartcargo-datebase-default-rtdb.firebaseio.com",
  projectId: "cjsmartcargo-datebase",
  storageBucket: "cjsmartcargo-datebase.firebasestorage.app",
  messagingSenderId: "751451468006",
  appId: "1:751451468006:web:a3cbd33cf3c2b29f624b27"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const V_PATH = 'tms/vehicles';
const D_PATH = 'tms/drivers';

// 审计日志（单证、证照的修改留痕）
TMS.audit.bind(p => push(ref(db, 'tms/audit_logs'), p));

// Tab Switching
window.switchTab = (type) => {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if(type === 'vehicle') {
    document.getElementById('vehicleSection').classList.add('active');
    document.getElementById('tabVeh').classList.add('active');
  } else {
    document.getElementById('driverSection').classList.add('active');
    document.getElementById('tabDrv').classList.add('active');
  }
}

/* ---------------- 到期状态 ---------------- */
function expiryBadge(dateStr, warnDays) {
  const days = TMS.util.daysUntil(dateStr);
  if (days === null) return { html: '<span class="exp none">未登记</span>', days: null, cls: 'none' };
  if (days < 0) return { html: `<span class="exp bad">已过期 ${Math.abs(days)} 天</span>`, days, cls: 'bad' };
  if (days <= (warnDays || 30)) return { html: `<span class="exp warn">${days} 天后到期</span>`, days, cls: 'warn' };
  return { html: `<span class="exp ok">${days} 天后到期</span>`, days, cls: 'ok' };
}

function overallBadge(items, warnDays) {
  let worst = null;
  items.forEach(d => {
    const b = expiryBadge(d, warnDays);
    if (b.days === null) return;
    if (!worst || b.days < worst.days) worst = b;
  });
  if (!worst) return '<span class="exp none">未登记</span>';
  return worst.html;
}

/* ---------------- 车辆单证定义 ---------------- */
const DOC_TYPES = [
  { key: 'roadTax', zh: '路税 Road Tax', en: 'Road Tax' },
  { key: 'insurance', zh: '保险 Insurance', en: 'Insurance' },
  { key: 'fitness', zh: '年检 Fitness', en: 'Fitness' },
  { key: 'crossBorder', zh: '跨境许可 Cross-border Permit', en: 'Cross-border Permit' },
  { key: 'other', zh: '其他 Other', en: 'Other' }
];

let docVehicleKey = null;
let vehiclesCache = {};

window.openDocModal = async (key) => {
  const snap = await get(ref(db, V_PATH + '/' + key));
  const v = snap.val() || {};
  vehiclesCache[key] = v;
  docVehicleKey = key;

  document.getElementById('docModalSub').innerText =
    `${v.head || ''} ${v.trailer ? '/ ' + v.trailer : ''} · 到期前 30 天会在这里标黄`;

  const docs = v.docs || {};
  document.getElementById('docRows').innerHTML = DOC_TYPES.map(d => {
    const cur = docs[d.key] || {};
    return `<div class="doc-grid" style="margin-bottom:8px">
      <div style="font-size:13px;font-weight:600">${d.zh}</div>
      <input id="doc_no_${d.key}" value="${(cur.no || '').replace(/"/g, '&quot;')}" placeholder="编号 / 备注">
      <input id="doc_exp_${d.key}" type="date" value="${cur.expiry || ''}">
    </div>`;
  }).join('');

  document.getElementById('docModal').classList.add('show');
};

window.closeDocModal = () => {
  document.getElementById('docModal').classList.remove('show');
  docVehicleKey = null;
};

window.saveDocs = async () => {
  if (!docVehicleKey) return;
  const payload = {};
  DOC_TYPES.forEach(d => {
    const no = document.getElementById(`doc_no_${d.key}`).value.trim();
    const expiry = document.getElementById(`doc_exp_${d.key}`).value;
    if (no || expiry) payload[d.key] = { no, expiry: expiry || null };
  });

  const v = vehiclesCache[docVehicleKey] || {};
  await set(ref(db, `${V_PATH}/${docVehicleKey}/docs`), payload);
  TMS.audit.log('车辆单证更新', v.head || docVehicleKey,
    Object.keys(payload).map(k => {
      const label = (DOC_TYPES.find(d => d.key === k) || {}).zh || k;
      return `${label} 到期 ${payload[k].expiry || '-'}`;
    }).join('；') || '无');
  closeDocModal();
};

/* ---------------- 车辆 ---------------- */
let vEditId = null;
onValue(ref(db, V_PATH), snap => {
  const data = snap.val() || {};
  vehiclesCache = data;
  const tbody = document.getElementById('vTbody');
  tbody.innerHTML = '';
  const keys = Object.keys(data);
  if (!keys.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">还没有车辆，先在上面添加</td></tr>';
    return;
  }
  keys.forEach(k => {
    const v = data[k];
    const docs = v.docs || {};
    const docList = DOC_TYPES.map(d => (docs[d.key] || {}).expiry).filter(Boolean);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${v.head||''}</td><td>${v.trailer||''}</td><td>${v.km||0}</td>
      <td>${docList.length ? overallBadge(docList, 30) : '<span class="exp none">未登记</span>'}</td>
      <td class="actions">
        <button class="editBtn" onclick="editV('${k}')">编辑</button>
        <button class="docBtn" onclick="openDocModal('${k}')">单证</button>
        <button class="delBtn" onclick="delV('${k}')">删除</button>
      </td>`;
    tbody.appendChild(tr);
  });
});

window.editV = (id) => {
  onValue(ref(db, V_PATH+'/'+id), snap => {
    const v = snap.val() || {};
    document.getElementById('head').value = v.head || '';
    document.getElementById('trailer').value = v.trailer || '';
    document.getElementById('km').value = v.km || 0;
    vEditId = id;
    document.getElementById('vFormTitle').innerText = '编辑车辆';
  }, {onlyOnce: true});
};

window.delV = async (id) => {
  if (!confirm('确认删除该车辆？单证信息会一并删除。')) return;
  const v = vehiclesCache[id] || {};
  await remove(ref(db, V_PATH+'/'+id));
  TMS.audit.log('删除车辆', v.head || id, '车辆档案删除');
};

document.getElementById('vSaveBtn').onclick = async () => {
  const payload = {
    head: document.getElementById('head').value.trim(),
    trailer: document.getElementById('trailer').value.trim(),
    km: parseFloat(document.getElementById('km').value) || 0
  };
  if (!payload.head) { alert('请填写车头号'); return; }

  if (vEditId) {
    // 用 update 而不是 set，避免覆盖 docs / maintaining 等其它字段
    await update(ref(db, V_PATH + '/' + vEditId), payload);
    TMS.audit.log('车辆档案修改', payload.head, `拖车 ${payload.trailer || '-'}，里程 ${payload.km}`);
  } else {
    await set(push(ref(db, V_PATH)), payload);
    TMS.audit.log('新增车辆', payload.head, `拖车 ${payload.trailer || '-'}`);
  }
  document.getElementById('vResetBtn').click();
};

document.getElementById('vResetBtn').onclick = () => {
  document.getElementById('head').value=''; document.getElementById('trailer').value=''; document.getElementById('km').value='';
  vEditId = null; document.getElementById('vFormTitle').innerText='添加车辆';
};

/* ---------------- 司机 ----------------
   兼容两种历史结构：tms/drivers/{key} 扁平 与 tms/drivers/{group}/{key} 分组
*/
let driverRows = [];

function normalizeDrivers(raw) {
  const out = [];
  Object.keys(raw || {}).forEach(k => {
    const node = raw[k] || {};
    if (node && typeof node === 'object' && node.name === undefined) {
      const children = Object.keys(node);
      const looksGrouped = children.some(c => node[c] && typeof node[c] === 'object' && node[c].name !== undefined);
      if (looksGrouped) {
        children.forEach(c => out.push({ path: `${D_PATH}/${k}/${c}`, id: `${k}/${c}`, data: node[c] || {}, group: k }));
        return;
      }
    }
    out.push({ path: `${D_PATH}/${k}`, id: k, data: node, group: null });
  });
  return out;
}

onValue(ref(db, D_PATH), snap => {
  const data = snap.val() || {};
  driverRows = normalizeDrivers(data);
  const tbody = document.getElementById('dTbody');
  if (!driverRows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">还没有司机，先在上面添加</td></tr>';
    return;
  }
  tbody.innerHTML = driverRows.map(r => {
    const d = r.data;
    const lic = expiryBadge(d.licenseExpiry, 30);
    const pass = expiryBadge(d.passportExpiry, 60);
    const permit = expiryBadge(d.permitExpiry, 60);
    const med = expiryBadge(d.medicalExpiry, 30);
    const worst = [lic, pass, permit, med].filter(b => b.days !== null)
      .sort((a, b) => a.days - b.days)[0];
    return `<tr>
      <td><b>${d.name || ''}</b><br><small style="color:#999">${d.licenseNo || ''}</small></td>
      <td>${d.nation || ''}</td>
      <td>${d.phone || ''}</td>
      <td>${pass.html}</td>
      <td>${lic.html}</td>
      <td>${worst ? worst.html : '<span class="exp none">未登记</span>'}
          ${permit.days !== null && permit.days < 90 ? '<br>工作许可 ' + permit.html : ''}</td>
      <td class="actions">
        <button class="editBtn" onclick="editD('${r.id}')">编辑</button>
        <button class="delBtn" onclick="delD('${r.id}')">删除</button>
      </td>
    </tr>`;
  }).join('');
});

function findDriver(id) { return driverRows.find(r => r.id === id); }

window.editD = (id) => {
  const row = findDriver(id);
  if (!row) return;
  const d = row.data;
  const setVal = (k, v) => { const el = document.getElementById(k); if (el) el.value = v === undefined || v === null ? '' : v; };
  setVal('name', d.name); setVal('dob', d.dob); setVal('passport', d.passport);
  setVal('passportExpiry', d.passportExpiry); setVal('nation', d.nation);
  setVal('experience', d.experience); setVal('phone', d.phone);
  setVal('licenseNo', d.licenseNo); setVal('licenseExpiry', d.licenseExpiry);
  setVal('permitExpiry', d.permitExpiry); setVal('medicalExpiry', d.medicalExpiry);
  dEditId = id;
  document.getElementById('dFormTitle').innerText = '编辑司机';
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.delD = async (id) => {
  const row = findDriver(id);
  if (!row) return;
  if (!confirm('确认删除该司机档案？')) return;
  await remove(ref(db, row.path));
  TMS.audit.log('删除司机', row.data.name || id, '司机档案删除');
};

let dEditId = null;

document.getElementById('dSaveBtn').onclick = async () => {
  const payload = {
    name: document.getElementById('name').value.trim(),
    dob: document.getElementById('dob').value,
    passport: document.getElementById('passport').value.trim(),
    passportExpiry: document.getElementById('passportExpiry').value,
    nation: document.getElementById('nation').value.trim(),
    experience: document.getElementById('experience').value,
    phone: document.getElementById('phone').value.trim(),
    licenseNo: document.getElementById('licenseNo').value.trim(),
    licenseExpiry: document.getElementById('licenseExpiry').value,
    permitExpiry: document.getElementById('permitExpiry').value,
    medicalExpiry: document.getElementById('medicalExpiry').value
  };
  if (!payload.name) { alert('请填写司机姓名'); return; }

  if (dEditId) {
    const row = findDriver(dEditId);
    if (!row) { alert('司机档案不存在，请刷新后重试'); return; }
    await update(ref(db, row.path), payload);
    TMS.audit.log('司机档案修改', payload.name, `驾照 ${payload.licenseExpiry || '-'}，护照 ${payload.passportExpiry || '-'}`);
  } else {
    // 新司机：沿用现有分组结构，避免与 dispatch.html 的读取方式冲突
    const groupedRow = driverRows.find(r => r.group);
    const path = groupedRow ? `${D_PATH}/${groupedRow.group}` : D_PATH;
    await push(ref(db, path), payload);
    TMS.audit.log('新增司机', payload.name, `国籍 ${payload.nation || '-'}`);
  }
  document.getElementById('dResetBtn').click();
};

document.getElementById('dResetBtn').onclick = () => {
  ['name','dob','passport','passportExpiry','nation','experience','phone','licenseNo','licenseExpiry','permitExpiry','medicalExpiry']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  dEditId = null; document.getElementById('dFormTitle').innerText='添加新司机';
};

/* ---------------- 语言 ---------------- */
const lang = localStorage.getItem('tms_lang') || 'zh';
const pack = {
  zh: { title: "车辆与司机档案", vTab: "车辆管理", dTab: "司机管理", vHead: "车头号", dName: "司机姓名", save: "保存" },
  en: { title: "Fleet & Driver Info", vTab: "Vehicles", dTab: "Drivers", vHead: "Head No", dName: "Driver Name", save: "Save" }
};
const t = pack[lang] || pack.zh;
document.getElementById('pageTitle').innerText = t.title;
document.getElementById('tabVeh').innerText = t.vTab;
document.getElementById('tabDrv').innerText = t.dTab;
document.getElementById('langToggle').onclick = () => {
  localStorage.setItem('tms_lang', lang === 'zh' ? 'en' : 'zh');
  location.reload();
};
</script>
</body>
